
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nihongo N5 - Choukai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1510;color:#edf5ef;font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px;background:#14291d;border-bottom:1px solid #34513c}
header h1{color:#9ce6b5}
header p{color:#a6b9aa;margin-top:7px;font-size:13px}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#14251b;border:1px solid #304b39;border-radius:15px;padding:20px;margin-bottom:16px}
.muted{color:#a6b9aa;font-size:13px;line-height:1.7}
button{border:0;border-radius:9px;padding:14px;background:#65cf8b;color:#092014;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:#304b39;color:white}
.hidden{display:none!important}
input[type=text]{width:100%;padding:14px;border-radius:9px;border:1px solid #45634c;background:#0b1710;color:white;font-size:16px;margin:12px 0}
.progress{height:7px;background:#304b39;border-radius:10px;margin:14px 0}
.progress div{height:100%;background:#65cf8b;width:0;border-radius:10px}
.dialogue{background:#0c1b12;padding:15px;border-radius:12px;margin:15px 0}
.speaker{padding:12px 0;border-bottom:1px solid #304b39;line-height:1.7}
.speaker:last-child{border:0}
.speaker b{color:#9ce6b5}
.romaji{color:#a6b9aa;font-size:13px}
.translation{color:#c1d5c5;font-size:13px}
.question{font-size:20px;line-height:1.7;margin:15px 0}
.option{display:block;padding:14px;border:1px solid #405c48;border-radius:9px;margin:9px 0;cursor:pointer}
.option:has(input:checked){background:#20432d;border-color:#65cf8b}
.option input{margin-right:10px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1}
.big{font-size:34px;color:#9ce6b5;margin:15px 0}
#driveButton{width:100%;margin-top:15px}
</style>
</head>
<body>

<header>
<h1>日本語 NIHONGO N5</h1>
<p>聴解 - CHOUKAI EXAMINATION</p>
</header>

<main>

<section id="home" class="card">
<h2>Choukai N5</h2>
<p class="muted">Latihan listening bahasa Jepang. Dengarkan percakapan dua orang, kemudian jawab pertanyaannya.</p>
<br>
<label class="muted">Nama peserta</label>
<input type="text" id="student" placeholder="Masukkan nama lengkap">
<button onclick="start()">MULAI UJIAN</button>
<p class="muted" style="margin-top:14px">15 soal • Kelulusan 80 • Hasil PDF Google Drive</p>
</section>

<section id="exam" class="card hidden">
<p class="muted" id="counter"></p>
<div class="progress"><div id="bar"></div></div>

<div class="dialogue" id="dialogue"></div>

<button id="play" onclick="playDialogue()">🔊 PUTAR PERCAKAPAN</button>
<p class="muted" id="audioStatus">Dengarkan percakapan sampai selesai.</p>

<div id="questionArea" class="hidden">
<hr style="border-color:#304b39;margin:20px 0">
<p class="muted">質問 - PERTANYAAN</p>
<div class="question" id="question"></div>
<p class="muted" id="translation"></p>
<div id="options"></div>
</div>

<div class="actions">
<button class="secondary" onclick="previous()">KEMBALI</button>
<button id="next" onclick="next()" disabled>BERIKUTNYA</button>
</div>
</section>

<section id="result" class="card hidden">
<h2>HASIL UJIAN CHOUKAI</h2>
<div class="big" id="score"></div>
<h3 id="passStatus"></h3>
<p class="muted" id="details"></p>
<br>
<button id="driveButton" onclick="sendResult()">KIRIM HASIL KE GOOGLE DRIVE</button>
<p id="driveStatus" class="muted" style="margin-top:12px"></p>
<br>
<button class="secondary" onclick="location.reload()">KEMBALI KE MENU</button>
</section>

</main>

<script>
/* GOOGLE APPS SCRIPT URL */
const API_URL="https://script.google.com/macros/s/AKfycbxSQhL6BQNxJ9mjeKJZbmTQsxuEiXJgIo1BMhdTgjq_shKgD28VjjAjQzt5mDA5Sh7pAA/exec";

/* BANK SOAL CHOUKAI N5 */
const questions=[
{
d:[
["男の人","田中さん、明日何をしますか。","Tanaka-san, ashita nani o shimasu ka?","Tanaka, besok mau melakukan apa?"],
["女の人","友達と映画を見に行きます。","Tomodachi to eiga o mi ni ikimasu.","Saya akan menonton film bersama teman."]
],
q:"女の人は明日何をしますか。",
r:"Onna no hito wa ashita nani o shimasu ka?",
t:"Apa yang akan dilakukan perempuan besok?",
o:["友達と映画を見ます","学校へ行きます","家で勉強します"],a:0
},
{
d:[
["母","もう宿題をしましたか。","Mou shukudai o shimashita ka?","Apakah PR-mu sudah dikerjakan?"],
["娘","はい。これからお風呂に入ります。","Hai. Kore kara ofuro ni hairimasu.","Ya. Sekarang saya mau mandi."]
],
q:"娘はこの後、何をしますか。",
r:"Musume wa kono ato nani o shimasu ka?",
t:"Apa yang akan dilakukan anak perempuan setelah ini?",
o:["宿題をします","お風呂に入ります","学校へ行きます"],a:1
},
{
d:[
["店員","いらっしゃいませ。何にしますか。","Irasshaimase. Nani ni shimasu ka?","Selamat datang. Mau pesan apa?"],
["女の人","コーヒーを一つください。","Koohii o hitotsu kudasai.","Tolong satu kopi."],
["店員","はい、300円です。","Hai, sanbyaku en desu.","Baik, 300 yen."]
],
q:"女の人は何を買いますか。",
r:"Onna no hito wa nani o kaimasu ka?",
t:"Apa yang dibeli perempuan?",
o:["お茶","コーヒー","ジュース"],a:1
},
{
d:[
["男の人","駅までどうやって行きますか。","Eki made dou yatte ikimasu ka?","Bagaimana pergi ke stasiun?"],
["女の人","バスで行きます。","Basu de ikimasu.","Saya pergi naik bus."]
],
q:"女の人は何で駅へ行きますか。",
r:"Onna no hito wa nani de eki e ikimasu ka?",
t:"Perempuan pergi ke stasiun naik apa?",
o:["電車","バス","自転車"],a:1
},
{
d:[
["女の人","今日は何時に起きましたか。","Kyou wa nanji ni okimashita ka?","Hari ini bangun jam berapa?"],
["男の人","六時に起きました。","Rokuji ni okimashita.","Saya bangun jam enam."]
],
q:"男の人は何時に起きましたか。",
r:"Otoko no hito wa nanji ni okimashita ka?",
t:"Laki-laki bangun jam berapa?",
o:["五時","六時","七時"],a:1
},
{
d:[
["男の人","日曜日、一緒にテニスをしませんか。","Nichiyoubi, issho ni tenisu o shimasen ka?","Mau bermain tenis bersama hari Minggu?"],
["女の人","すみません。日曜日は仕事があります。","Sumimasen. Nichiyoubi wa shigoto ga arimasu.","Maaf. Hari Minggu saya ada pekerjaan."]
],
q:"女の人は日曜日、何をしますか。",
r:"Onna no hito wa nichiyoubi nani o shimasu ka?",
t:"Apa yang dilakukan perempuan hari Minggu?",
o:["テニスをします","仕事をします","映画を見ます"],a:1
},
{
d:[
["女の人","今日は天気がいいですね。","Kyou wa tenki ga ii desu ne.","Cuacanya bagus hari ini, ya."],
["男の人","そうですね。でも、明日は雨ですよ。","Sou desu ne. Demo, ashita wa ame desu yo.","Benar. Tapi besok hujan."]
],
q:"明日の天気はどうですか。",
r:"Ashita no tenki wa dou desu ka?",
t:"Bagaimana cuaca besok?",
o:["晴れです","雨です","雪です"],a:1
},
{
d:[
["男の人","すみません。トイレはどこですか。","Sumimasen. Toire wa doko desu ka?","Permisi, toilet ada di mana?"],
["女の人","あそこです。銀行の隣です。","Asoko desu. Ginkou no tonari desu.","Di sana. Di sebelah bank."]
],
q:"トイレはどこにありますか。",
r:"Toire wa doko ni arimasu ka?",
t:"Di mana toilet berada?",
o:["銀行の隣","学校の前","駅の中"],a:0
},
{
d:[
["女の人","昨日、何を食べましたか。","Kinou, nani o tabemashita ka?","Kemarin makan apa?"],
["男の人","友達とラーメンを食べました。","Tomodachi to raamen o tabemashita.","Saya makan ramen bersama teman."]
],
q:"男の人は昨日、何を食べましたか。",
r:"Otoko no hito wa kinou nani o tabemashita ka?",
t:"Apa yang dimakan laki-laki kemarin?",
o:["すし","ラーメン","パン"],a:1
},
{
d:[
["母","スーパーへ行きます。何か買いますか。","Suupaa e ikimasu. Nanika kaimasu ka?","Ibu mau pergi ke supermarket. Mau beli sesuatu?"],
["息子","牛乳を買ってください。","Gyuunyuu o katte kudasai.","Tolong belikan susu."]
],
q:"息子は何を買ってほしいですか。",
r:"Musuko wa nani o katte hoshii desu ka?",
t:"Apa yang ingin dibelikan anak laki-laki?",
o:["牛乳","卵","水"],a:0
},
{
d:[
["男の人","今、何人家族ですか。","Ima, nan nin kazoku desu ka?","Sekarang keluarga kamu ada berapa orang?"],
["女の人","四人です。父と母と弟と私です。","Yonin desu. Chichi to haha to otouto to watashi desu.","Empat orang. Ayah, ibu, adik laki-laki, dan saya."]
],
q:"女の人の家族は何人ですか。",
r:"Onna no hito no kazoku wa nan nin desu ka?",
t:"Ada berapa orang dalam keluarga perempuan?",
o:["三人","四人","五人"],a:1
},
{
d:[
["女の人","夏休みにどこへ行きますか。","Natsuyasumi ni doko e ikimasu ka?","Liburan musim panas mau pergi ke mana?"],
["男の人","北海道へ行きます。","Hokkaidou e ikimasu.","Saya akan pergi ke Hokkaido."]
],
q:"男の人はどこへ行きますか。",
r:"Otoko no hito wa doko e ikimasu ka?",
t:"Ke mana laki-laki akan pergi?",
o:["東京","大阪","北海道"],a:2
},
{
d:[
["男の人","この本はいくらですか。","Kono hon wa ikura desu ka?","Berapa harga buku ini?"],
["店員","500円です。","Gohyaku en desu.","500 yen."]
],
q:"本はいくらですか。",
r:"Hon wa ikura desu ka?",
t:"Berapa harga buku?",
o:["300円","500円","700円"],a:1
},
{
d:[
["女の人","毎朝、何をしますか。","Maiasa, nani o shimasu ka?","Setiap pagi melakukan apa?"],
["男の人","朝ご飯を食べて、学校へ行きます。","Asagohan o tabete, gakkou e ikimasu.","Saya sarapan lalu pergi ke sekolah."]
],
q:"男の人は朝ご飯の後、何をしますか。",
r:"Otoko no hito wa asagohan no ato nani o shimasu ka?",
t:"Apa yang dilakukan laki-laki setelah sarapan?",
o:["学校へ行きます","寝ます","テレビを見ます"],a:0
},
{
d:[
["男の人","すみません。田中さんはいますか。","Sumimasen. Tanaka-san wa imasu ka?","Permisi, apakah Tanaka ada?"],
["女の人","田中さんは今、会議室にいます。","Tanaka-san wa ima, kaigishitsu ni imasu.","Tanaka sekarang ada di ruang rapat."]
],
q:"田中さんは今どこにいますか。",
r:"Tanaka-san wa ima doko ni imasu ka?",
t:"Di mana Tanaka sekarang?",
o:["事務室","会議室","食堂"],a:1
}
];

let index=0,answers=Array(15).fill(null);
let studentName="",busy=false,sending=false;

function start(){
 studentName=document.getElementById("student").value.trim();
 if(!studentName){alert("Masukkan nama peserta!");return;}
 document.getElementById("home").classList.add("hidden");
 document.getElementById("exam").classList.remove("hidden");
 show();
}

function show(){
 speechSynthesis.cancel();
 busy=false;
 const q=questions[index];
 document.getElementById("counter").textContent=`Soal ${index+1} dari 15`;
 document.getElementById("bar").style.width=((index+1)/15*100)+"%";
 document.getElementById("dialogue").innerHTML="";

 q.d.forEach(line=>{
  const div=document.createElement("div");
  div.className="speaker";
  const b=document.createElement("b");b.textContent=line[0];
  const jp=document.createElement("div");jp.textContent=line[1];
  const ro=document.createElement("div");ro.className="romaji";ro.textContent=line[2];
  const tr=document.createElement("div");tr.className="translation";tr.textContent=line[3];
  div.append(b,jp,ro,tr);
  document.getElementById("dialogue").appendChild(div);
 });

 document.getElementById("questionArea").classList.add("hidden");
 document.getElementById("audioStatus").textContent="Dengarkan percakapan sampai selesai.";
 document.getElementById("play").disabled=false;
 document.getElementById("play").textContent="🔊 PUTAR PERCAKAPAN";
 document.getElementById("next").disabled=true;
 document.getElementById("next").textContent=index===14?"SELESAI":"BERIKUTNYA";
 document.getElementById("question").textContent=q.q;
 document.getElementById("translation").textContent=q.r+" — "+q.t;

 const area=document.getElementById("options");
 area.innerHTML="";
 q.o.forEach((opt,i)=>{
  const label=document.createElement("label");
  label.className="option";
  const radio=document.createElement("input");
  radio.type="radio";radio.name="answer";radio.checked=answers[index]===i;
  radio.onchange=()=>{answers[index]=i;document.getElementById("next").disabled=false;};
  label.append(radio,document.createTextNode(["A. ","B. ","C. "][i]+opt));
  area.appendChild(label);
 });
}

function playDialogue(){
 if(busy)return;
 if(!window.speechSynthesis){alert("Browser tidak mendukung audio Jepang.");return;}
 speechSynthesis.cancel();
 busy=true;
 document.getElementById("play").disabled=true;
 document.getElementById("play").textContent="SEDANG DIPUTAR...";
 let i=0;
 const lines=questions[index].d;
 function nextVoice(){
  if(i>=lines.length){
   busy=false;
   document.getElementById("play").disabled=false;
   document.getElementById("play").textContent="🔁 PUTAR ULANG";
   document.getElementById("audioStatus").textContent="Audio selesai. Silakan jawab.";
   document.getElementById("questionArea").classList.remove("hidden");
   return;
  }
  const u=new SpeechSynthesisUtterance(lines[i][1]);
  u.lang="ja-JP";u.rate=.83;
  u.pitch=lines[i][0]==="男の人"?.85:1.08;
  u.onend=()=>{i++;setTimeout(nextVoice,400);};
  u.onerror=()=>{
   busy=false;
   document.getElementById("play").disabled=false;
   document.getElementById("audioStatus").textContent="Audio gagal. Coba putar lagi.";
  };
  speechSynthesis.speak(u);
 }
 nextVoice();
}

function previous(){
 if(index>0){index--;show();}
}
function next(){
 if(answers[index]===null){alert("Pilih jawaban dahulu.");return;}
 if(index<14){index++;show();}
 else finish();
}

function finish(){
 speechSynthesis.cancel();
 const correct=questions.reduce((sum,q,i)=>sum+(answers[i]===q.a?1:0),0);
 const score=Math.round(correct/15*100);
 document.getElementById("exam").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score+"/100";
 document.getElementById("passStatus").textContent=score>=80?"合格 - LULUS":"不合格 - BELUM LULUS";
 document.getElementById("details").textContent=`${studentName} • ${correct} jawaban benar dari 15 soal.`;
}

function sendResult(){
 if(sending)return;
 const correct=questions.reduce((sum,q,i)=>sum+(answers[i]===q.a?1:0),0);
 const score=Math.round(correct/15*100);

 const payload={
  name:studentName,
  category:"Choukai",
  score:score,
  correct:correct,
  total:15,
  status:score>=80?"LULUS":"BELUM LULUS",
  details:questions.map((q,i)=>({
   question:q.q,
   answer:answers[i]===null?"Tidak dijawab":q.o[answers[i]],
   correct:q.o[q.a],
   isCorrect:answers[i]===q.a
  }))
 };

 sending=true;
 const button=document.getElementById("driveButton");
 const status=document.getElementById("driveStatus");
 button.disabled=true;
 button.textContent="MENGIRIM...";

 let frame=document.getElementById("driveFrame");
 if(!frame){
  frame=document.createElement("iframe");
  frame.name="driveFrame";
  frame.id="driveFrame";
  frame.style.display="none";
  document.body.appendChild(frame);
 }

 const form=document.createElement("form");
 form.method="POST";
 form.action=API_URL;
 form.target="driveFrame";
 form.style.display="none";

 const input=document.createElement("input");
 input.type="hidden";
 input.name="payload";
 input.value=JSON.stringify(payload);

 form.appendChild(input);
 document.body.appendChild(form);
 form.submit();

 status.textContent="Permintaan dikirim. Periksa folder Google Drive untuk memastikan PDF berhasil dibuat.";
 button.textContent="PERMINTAAN TERKIRIM";
 setTimeout(()=>form.remove(),3000);
}
</script>
</body>
</html>
