
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLPT N5 Mock Exam</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;background:#151d35;border-bottom:1px solid #34415f}
header h1{margin:0;color:#8ab4ff}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:#151d35;padding:22px;border:1px solid #34415f;border-radius:16px;margin-bottom:16px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #52617e;background:#0b1020;color:white;margin:12px 0}
button{padding:12px 17px;border:0;border-radius:9px;background:#477cf5;color:white;font-weight:bold;cursor:pointer;margin:5px}
button:disabled{opacity:.4}
.secondary{background:#34415f}
.option{display:block;width:100%;text-align:left;background:#25314e;margin:9px 0;padding:15px}
.option.selected{background:#315eae;outline:2px solid #8ab4ff}
#exam,#result{display:none}
#question{font-size:25px;text-align:center;padding:25px 5px}
#progress{height:8px;background:#34415f;border-radius:8px;overflow:hidden}
#bar{height:100%;width:0;background:#8ab4ff}
.small{color:#aebbd5;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:15px}
.grid button{padding:9px 2px;background:#34415f}
.grid button.answered{background:#287d65}
.grid button.current{outline:2px solid #8ab4ff}
.correct{color:#66e0a3}.wrong{color:#ff8585}
</style>
</head>
<body>
<header>
<h1>日本語 JLPT N5</h1>
<p>Japanese Language Mock Examination</p>
</header>
<main>
<section id="home" class="card">
<h2>JLPT N5 Mock Test</h2>
<p class="small">105 soal · Waktu 90 menit · Nilai kelulusan 80%</p>
<label>Nama peserta</label>
<input id="name" placeholder="Masukkan nama lengkap">
<button onclick="start('all')">Mulai Ujian Lengkap</button>
<hr>
<h3>Latihan per bagian</h3>
<button class="secondary" onclick="start('kana')">Hiragana & Katakana</button>
<button class="secondary" onclick="start('grammar')">Bunpou</button>
<button class="secondary" onclick="start('kanji')">Kanji</button>
<button class="secondary" onclick="start('listening')">Choukai</button>
</section>

<section id="exam" class="card">
<div style="display:flex;justify-content:space-between;gap:10px">
<strong id="sectionName">Ujian</strong>
<strong id="timer">90:00</strong>
</div>
<p class="small" id="counter"></p>
<div id="progress"><div id="bar"></div></div>
<div id="question"></div>
<button id="listenBtn" class="secondary" style="display:none" onclick="speak()">▶ Dengarkan audio</button>
<div id="options"></div>
<div class="grid" id="numbers"></div>
<div style="display:flex;justify-content:space-between;margin-top:18px">
<button class="secondary" onclick="move(-1)">Sebelumnya</button>
<button onclick="move(1)">Berikutnya</button>
</div>
<button style="width:100%;margin-top:15px" onclick="finish()">Selesaikan ujian</button>
</section>

<section id="result" class="card">
<h2>Hasil Ujian</h2>
<h1 id="score"></h1>
<p id="status"></p>
<p id="detail"></p>
<div id="certificate"></div>
<h3>Pembahasan Jawaban</h3>
<div id="review"></div>
<button onclick="location.reload()">Kembali ke Beranda</button>
</section>
</main>

<script>
const banks = {
kana: [
["あ","a","i","u","e",0],["い","i","a","o","u",0],["う","u","e","a","o",0],["え","e","o","i","a",0],["お","o","u","e","a",0],
["か","ka","ki","ku","ke",0],["き","ki","ka","ko","ku",0],["く","ku","ke","ka","ki",0],["け","ke","ko","ku","ka",0],["こ","ko","ki","ka","ku",0],
["さ","sa","shi","su","se",0],["し","shi","sa","chi","tsu",0],["す","su","se","so","shi",0],["せ","se","so","sa","su",0],["そ","so","shi","su","se",0],
["た","ta","chi","tsu","te",0],["ち","chi","tsu","ta","te",0],["つ","tsu","te","to","chi",0],["て","te","ta","to","tsu",0],["と","to","ta","te","chi",0],
["な","na","ni","nu","ne",0],["に","ni","na","no","nu",0],["ぬ","nu","ne","na","ni",0],["ね","ne","no","nu","na",0],["の","no","ni","na","nu",0],
["は","ha","hi","fu","he",0],["ひ","hi","ha","he","ho",0],["ふ","fu","hu","ha","hi",0],["へ","he","ho","ha","fu",0],["ほ","ho","ha","hi","he",0],
["ま","ma","mi","mu","me",0],["み","mi","ma","mo","mu",0],["む","mu","me","ma","mi",0],["め","me","mo","mu","ma",0],["も","mo","mi","ma","mu",0],
["や","ya","yu","yo","wa",0],["ゆ","yu","ya","yo","wa",0],["よ","yo","yu","ya","wa",0],
["ら","ra","ri","ru","re",0],["り","ri","ra","ro","ru",0],
["ア","a","i","u","e",0],["イ","i","a","o","u",0],["ウ","u","e","a","o",0],["エ","e","o","i","a",0],["オ","o","u","e","a",0],
["カ","ka","ki","ku","ke",0],["キ","ki","ka","ko","ku",0],["ク","ku","ke","ka","ki",0],["ケ","ke","ko","ku","ka",0],["コ","ko","ki","ka","ku",0]
],
grammar: [
["わたし___学生です。","は","を","に","で",0],
["毎日学校___行きます。","に","を","が","で",0],
["パン___食べます。","を","に","へ","が",0],
["これは私___本です。","の","を","に","で",0],
["昨日、学校へ___。","行きました","行きます","行きません","行きませんでした",0],
["日本語___勉強しています。","を","が","に","へ",0],
["友達___映画を見ました。","と","を","が","へ",0],
["机の上___本があります。","に","を","へ","が",0],
["日曜日は学校へ___。","行きません","行きました","行きますか","行って",0],
["これは何___本ですか。","の","を","に","で",0],
["ご飯を食べて___、勉強します。","から","まで","より","しか",0],
["日本へ行きたい___。","です","ます","でした","ません",0],
["あの人は先生___思います。","だと","を","に","で",0],
["雨が降っています___、出かけません。","から","まで","しか","でも",0],
["日本語はおもしろい___思います。","と","を","に","が",0],
["毎朝6時___起きます。","に","を","で","へ",0],
["ここで写真を撮って___いいですか。","も","は","が","を",0],
["私は泳ぐこと___できます。","が","を","に","で",0],
["昨日は暑く___。","なかったです","ありません","ないです","でした",0],
["駅まで歩いて___。","行きます","します","あります","います",0]
],
kanji: [
["山","やま","かわ","そら","あめ",0],["川","かわ","やま","うみ","もり",0],
["日","ひ","つき","みず","き",0],["月","つき","ひ","やま","かぜ",0],
["水","みず","ひ","き","かわ",0],["火","ひ","みず","つち","き",0],
["木","き","はな","くさ","やま",0],["金","かね","みず","ひ","つき",0],
["土","つち","き","ひ","みず",0],["人","ひと","いぬ","ねこ","こども",0],
["大きい","おおきい","ちいさい","たかい","ひくい",0],
["小さい","ちいさい","おおきい","ながい","みじかい",0],
["学校","がっこう","びょういん","えき","ぎんこう",0],
["先生","せんせい","がくせい","ともだち","かいしゃ",0],
["学生","がくせい","せんせい","いしゃ","しゃいん",0],
["電車","でんしゃ","じてんしゃ","くるま","ひこうき",0],
["食べる","たべる","のむ","みる","きく",0],
["飲む","のむ","たべる","かく","よむ",0],
["今日","きょう","きのう","あした","あさ",0],
["明日","あした","きょう","きのう","ばん",0]
],
listening: [
["お名前は何ですか。","田中です。","学生です。","元気です。","日本です。",0],
["明日は何曜日ですか。","月曜日です。","七時です。","学校です。","雨です。",0],
["何時に起きますか。","六時に起きます。","学校へ行きます。","パンを食べます。","昨日です。",0],
["何を飲みますか。","水を飲みます。","本を読みます。","学校へ行きます。","映画を見ます。",0],
["どこへ行きますか。","駅へ行きます。","八時です。","友達です。","暑いです。",0],
["これはいくらですか。","百円です。","三つです。","りんごです。","店です。",0],
["誰と行きますか。","友達と行きます。","バスで行きます。","明日行きます。","駅へ行きます。",0],
["何を食べましたか。","すしを食べました。","水を飲みました。","本を買いました。","学校へ行きました。",0],
["今日は天気はどうですか。","いい天気です。","学生です。","六時です。","日曜日です。",0],
["何で学校へ行きますか。","バスで行きます。","七時です。","先生です。","学校です。",0],
["どこで本を買いますか。","本屋で買います。","駅で会います。","家で寝ます。","学校へ行きます。",0],
["何時から働きますか。","九時からです。","会社です。","昨日です。","三人です。",0],
["何をしていますか。","本を読んでいます。","昨日でした。","駅にいます。","学生です。",0],
["週末は何をしますか。","映画を見ます。","六時です。","雨です。","先生です。",0],
["これは誰のかばんですか。","私のです。","赤いです。","高いです。","学校です。",0]
]
};

let questions=[],answers=[],current=0,seconds=5400,tick=null,full=false,finished=false;
const $=id=>document.getElementById(id);
function start(type){
 const name=$("name").value.trim();
 if(!name){alert("Masukkan nama terlebih dahulu.");return;}
 full=type==="all";
 questions=type==="all"?[...banks.kana,...banks.grammar,...banks.kanji,...banks.listening]:banks[type];
 answers=Array(questions.length).fill(null);current=0;finished=false;
 $("home").style.display="none";$("exam").style.display="block";
 $("sectionName").textContent=type==="all"?"Ujian Lengkap JLPT N5":type.toUpperCase();
 seconds=full?5400:Math.max(600,questions.length*60);
 clearInterval(tick);
 tick=setInterval(()=>{
  seconds--;
  $("timer").textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
  if(seconds<=0)finish();
 },1000);
 render();
}
function render(){
 const q=questions[current];
 $("counter").textContent=`Soal ${current+1} dari ${questions.length}`;
 $("bar").style.width=((current+1)/questions.length*100)+"%";
 $("question").textContent=q[0];
 $("options").innerHTML="";
 $("listenBtn").style.display=questions.indexOf(q)>=50+20+20?"inline-block":"none";
 q.slice(1,5).forEach((v,i)=>{
  const b=document.createElement("button");
  b.className="option"+(answers[current]===i?" selected":"");
  b.textContent=String.fromCharCode(65+i)+". "+v;
  b.onclick=()=>{answers[current]=i;render()};
  $("options").appendChild(b);
 });
 $("numbers").innerHTML="";
 questions.forEach((_,i)=>{
  const b=document.createElement("button");
  b.textContent=i+1;
  if(answers[i]!==null)b.classList.add("answered");
  if(i===current)b.classList.add("current");
  b.onclick=()=>{current=i;render()};
  $("numbers").appendChild(b);
 });
}
function move(n){current=Math.max(0,Math.min(questions.length-1,current+n));render()}
function speak(){
 const text=questions[current][0];
 const u=new SpeechSynthesisUtterance(text);
 u.lang="ja-JP";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);
}
function finish(){
 if(finished)return;
 if(!confirm("Selesaikan ujian sekarang?"))return;
 finished=true;clearInterval(tick);
 let correct=0;
 questions.forEach((q,i)=>{if(answers[i]===q[5])correct++});
 const pct=Math.round(correct/questions.length*100);
 const passed=full&&questions.length===105&&pct>=80;
 $("exam").style.display="none";$("result").style.display="block";
 $("score").textContent=pct+"%";
 $("status").textContent=passed?"SELAMAT! KAMU LULUS SIMULASI JLPT N5":"Belum mencapai nilai kelulusan 80%.";
 $("detail").textContent=`Jawaban benar: ${correct} dari ${questions.length}.`;
 $("review").innerHTML=questions.map((q,i)=>{
  const ok=answers[i]===q[5];
  return `<p class="${ok?'correct':'wrong'}">${i+1}. ${q[0]}<br>Jawaban kamu: ${answers[i]===null?'Kosong':q[answers[i]+1]}<br>Kunci: ${q[q[5]+1]}</p>`;
 }).join("");
 if(passed){
  $("certificate").innerHTML="<p>Sedang membuat sertifikat PDF dan menyimpannya ke Google Drive...</p>";
  google.script.run.withSuccessHandler(res=>{
   if(res&&res.ok){
    $("certificate").innerHTML=`<h3 class="correct">Sertifikat berhasil dibuat!</h3><p>ID: ${res.id}</p><a href="${res.url}" target="_blank" style="color:#8ab4ff">Buka sertifikat PDF di Google Drive</a>`;
   }else $("certificate").textContent="Gagal: "+(res.error||"Terjadi kesalahan.");
  }).withFailureHandler(err=>{
   $("certificate").textContent="Gagal menghubungkan ke Apps Script: "+err.message;
  }).createCertificate({
   name:$("name").value.trim(),correct,total:questions.length,percentage:pct
  });
 }else{
  $("certificate").textContent=full?"Sertifikat diberikan jika nilai mencapai minimal 80%.":"Latihan bagian tidak menerbitkan sertifikat.";
 }
}
</script>
</body>
</html>
