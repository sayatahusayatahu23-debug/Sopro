
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nihongo N5 Examination</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1511;color:#f1f5f2;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #294336}
header b{color:#a5d9b0;font-size:21px}
main{width:90%;max-width:1000px;margin:auto}
.hero{padding:55px 0 25px}
.hero small{color:#9bd5a8;letter-spacing:3px}
h1{font-size:clamp(35px,7vw,60px);margin:15px 0}
h1 span{color:#9bd5a8}
p{color:#aabbb0;line-height:1.7}
input{padding:14px;background:#17251d;border:1px solid #345340;color:white;border-radius:10px;width:100%;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin:25px 0}
.card,.box{background:#17251d;border:1px solid #345340;border-radius:16px;padding:22px}
.symbol{font-size:35px;color:#9bd5a8}
button{padding:13px 18px;border:0;border-radius:9px;background:#9bd5a8;color:#102016;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
button.secondary{background:#27392e;color:white;border:1px solid #45634e}
button:disabled{opacity:.4}
.hidden{display:none!important}
.box{margin:30px auto;max-width:750px}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar{height:7px;background:#304137;border-radius:20px;margin:20px 0}
.bar div{height:100%;background:#9bd5a8;width:0;border-radius:20px}
.question{font-size:29px;font-weight:bold;margin:35px 0 12px;line-height:1.5}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}
.option{background:#213328;color:white;border:1px solid #405b49;text-align:left}
.option.selected{border:2px solid #9bd5a8;background:#304a37}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:25px;flex-wrap:wrap}
.score{font-size:65px;color:#a5d9b0;font-weight:bold}
.pass{color:#9bd5a8}.fail{color:#ff9999}
.certificate{background:#f6f4e9;color:#24382a;padding:30px 15px;text-align:center;border:10px double #779579;margin:25px 0}
.certificate h2{font-family:Georgia,serif;font-size:30px}
.certificate .student{font-size:25px;font-weight:bold;border-bottom:1px solid #779579;padding:12px;display:inline-block}
.certificate p{color:#46584b}
footer{text-align:center;padding:30px;color:#7e9585}
@media(max-width:550px){.options{grid-template-columns:1fr}.question{font-size:24px}}
@media print{
body{background:white;color:black}
header,#home,#exam,.no-print,footer{display:none!important}
#result{display:block!important}
.box{border:0;margin:0;padding:0}
.certificate{margin:10px auto}
}
</style>
</head>
<body>

<header><b>日本語 NIHONGO N5</b></header>

<main>
<section id="home">
<div class="hero">
<small>JAPANESE LANGUAGE EXAMINATION</small>
<h1>Learn Japanese.<br><span>Test Your Skills.</span></h1>
<p>Uji kemampuan bahasa Jepang N5 kamu. Selesaikan ujian dan dapatkan sertifikat jika mencapai nilai minimal 80%.</p>

<input id="student" placeholder="Nama lengkap peserta">

</div>
<div class="grid" id="examList"></div>
</section>

<section id="exam" class="box hidden">
<div class="topline">
<b id="examName"></b>
<span id="counter"></span>
</div>
<div class="bar"><div id="progress"></div></div>
<div id="audio"></div>
<div class="question" id="question"></div>
<div id="options" class="options"></div>
<div class="actions">
<button class="secondary" onclick="backHome()">Keluar</button>
<button id="next" onclick="nextQuestion()">Selanjutnya →</button>
</div>
</section>

<section id="result" class="box hidden">
<h2>Hasil Ujian</h2>
<div class="score" id="score"></div>
<h3 id="status"></h3>
<p id="detail"></p>
<div id="certificate"></div>
<div class="actions no-print">
<button onclick="window.print()">Cetak Sertifikat / PDF</button>
<button class="secondary" onclick="backHome()">Menu utama</button>
</div>
<p id="driveStatus"></p>
</section>
</main>

<footer>NIHONGO N5 EXAMINATION SYSTEM</footer>

<script>
// GANTI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT
const API_URL="https://script.google.com/macros/s/AKfycbxpXqVHEkK1ijDmtsBl7vOL7gA3mqVEGbIG8a8C42q2VGQPJJqJL0tEw_rKbwa1E3uwHw/exec";

const PASS=80;

const DB={
hiragana:[
["あ","a","i","u","e"],["い","i","a","o","u"],
["う","u","a","e","i"],["え","e","a","i","o"],
["お","o","u","a","e"],["か","ka","ki","ku","ke"],
["き","ki","ka","ku","sa"],["く","ku","ko","ke","ki"],
["け","ke","ka","ku","ko"],["こ","ko","ka","ki","ku"],
["さ","sa","shi","su","se"],["し","shi","sa","chi","tsu"],
["す","su","so","se","shi"],["せ","se","sa","su","so"],
["そ","so","shi","su","sa"],["た","ta","chi","tsu","te"],
["ち","chi","ta","tsu","to"],["つ","tsu","su","chi","te"],
["て","te","ta","to","tsu"],["と","to","ta","chi","te"],
["な","na","ni","nu","ne"],["に","ni","na","no","nu"],
["ぬ","nu","ne","na","ni"],["ね","ne","no","nu","na"],
["の","no","na","ni","nu"]
],
katakana:[
["ア","a","i","u","e"],["イ","i","a","o","u"],
["ウ","u","a","e","i"],["エ","e","a","i","o"],
["オ","o","u","a","e"],["カ","ka","ki","ku","ke"],
["キ","ki","ka","ku","sa"],["ク","ku","ko","ke","ki"],
["ケ","ke","ka","ku","ko"],["コ","ko","ka","ki","ku"],
["サ","sa","shi","su","se"],["シ","shi","sa","chi","tsu"],
["ス","su","so","se","shi"],["セ","se","sa","su","so"],
["ソ","so","shi","su","sa"],["タ","ta","chi","tsu","te"],
["チ","chi","ta","tsu","to"],["ツ","tsu","su","chi","te"],
["テ","te","ta","to","tsu"],["ト","to","ta","chi","te"],
["ナ","na","ni","nu","ne"],["ニ","ni","na","no","nu"],
["ヌ","nu","ne","na","ni"],["ネ","ne","no","nu","na"],
["ノ","no","na","ni","nu"]
],
kanji:[
["山","やま (gunung)","かわ (sungai)","た (sawah)","そら (langit)"],
["川","かわ (sungai)","やま (gunung)","うみ (laut)","あめ (hujan)"],
["人","ひと (orang)","くち (mulut)","て (tangan)","め (mata)"],
["日","ひ (matahari)","つき (bulan)","みず (air)","き (pohon)"],
["月","つき (bulan)","ひ (matahari)","ほし (bintang)","そら (langit)"],
["火","ひ (api)","みず (air)","き (pohon)","つち (tanah)"],
["水","みず (air)","ひ (api)","かね (uang)","いし (batu)"],
["木","き (pohon)","はな (bunga)","くさ (rumput)","やま (gunung)"],
["金","かね (uang)","みず (air)","ひ (api)","つき (bulan)"],
["土","つち (tanah)","そら (langit)","かわ (sungai)","あめ (hujan)"],
["大","おおきい (besar)","ちいさい (kecil)","ながい (panjang)","たかい (tinggi)"],
["小","ちいさい (kecil)","おおきい (besar)","あたらしい (baru)","ふるい (lama)"],
["中","なか (dalam)","そと (luar)","うえ (atas)","した (bawah)"],
["上","うえ (atas)","した (bawah)","なか (dalam)","みぎ (kanan)"],
["下","した (bawah)","うえ (atas)","ひだり (kiri)","まえ (depan)"],

["学生","がくせい (pelajar)","せんせい (guru)","いしゃ (dokter)","かいしゃいん (pegawai)"],
["電車","でんしゃ (kereta)","じてんしゃ (sepeda)","くるま (mobil)","ひこうき (pesawat)"],
["本","ほん (buku)","みず (air)","かみ (kertas)","えんぴつ (pensil)"]
],
bunpou:[
["わたし ___ インドネシア人です。","は","を","に","で"],

["宿題をした ___、テレビを見ます。","後で","前で","時にを","までに"],
["雨が降っています ___、出かけません。","から","まで","だけ","しか"],

["ここでたばこを吸っては ___。","いけません","いいです","あります","ください"],
["毎日勉強し ___なります。","て","た","ない","ます"]
],
choukai:[
["おはようございます。","Selamat pagi","Selamat malam","Terima kasih","Selamat tinggal"],
["ありがとうございます。","Terima kasih","Maaf","Sama-sama","Selamat pagi"],

["トイレはどこですか。","Toilet di mana?","Rumah siapa?","Ini apa?","Jam berapa?"],
["水をください。","Tolong beri saya air","Saya minum teh","Air itu dingin","Saya tidak mau air"],
["駅まで歩きます。","Saya berjalan sampai stasiun","Saya naik kereta","Saya pergi ke sekolah","Saya pulang"],
["今日は暑いですね。","Hari ini panas ya","Hari ini dingin ya","Besok hujan","Kemarin menyenangkan"],
["毎日日本語を勉強します。","Saya belajar bahasa Jepang setiap hari","Saya mengajar setiap hari","Saya belajar bahasa Inggris","Saya tidak belajar"],
["日曜日に映画を見ます。","Saya menonton film hari Minggu","Saya bekerja hari Minggu","Saya membaca buku","Saya pergi hari Senin"],
["これはいくらですか。","Ini harganya berapa?","Ini punya siapa?","Ini kapan?","Ini di mana?"],
["バスで学校へ行きます。","Saya pergi ke sekolah naik bus","Saya pergi naik kereta","Saya berjalan ke sekolah","Saya pulang naik bus"],
["もう昼ご飯を食べました。","Saya sudah makan siang","Saya belum sarapan","Saya akan makan malam","Saya sedang memasak"],
["少し待ってください。","Tolong tunggu sebentar","Tolong datang besok","Tolong bicara pelan","Tolong duduk"],
["誕生日は三月二十八日です。","Ulang tahun 28 Maret","Ulang tahun 3 Agustus","Hari ini 28 Maret","Saya lahir bulan Mei"]
]
};

const TYPES=[
["hiragana","あ","Hiragana",25],
["katakana","ア","Katakana",25],
["kanji","漢","Kanji",20],
["bunpou","文","Bunpou",20],
["choukai","耳","Choukai",15]
];
let type="",list=[],pos=0,answers=[],name="";
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderMenu(){
$("examList").innerHTML=TYPES.map(t=>`
<div class="card">
<div class="symbol">${t[1]}</div><h3>${t[2]}</h3>
<p>${t[3]} soal pilihan ganda. Urutan soal dan pilihan jawaban diacak.</p>
<div class="meta">${t[3]} SOAL · MINIMAL 80%</div>
<button onclick="start('${t[0]}')">Mulai ujian →</button>
</div>`).join("");
}
function start(k){
name=$("student").value.trim();
if(!name){alert("Masukkan nama lengkap terlebih dahulu.");$("student").focus();return}
type=k;
list=shuffle(DB[k]).map(q=>({q:q[0],a:q[1],opts:shuffle(q.slice(1))}));
pos=0;answers=Array(list.length).fill(null);
$("home").classList.add("hidden");$("result").classList.add("hidden");$("exam").classList.remove("hidden");
$("examName").textContent=TYPES.find(t=>t[0]===k)[2];
show();
window.scrollTo(0,0);
}
function show(){
let q=list[pos];
$("counter").textContent=`Soal ${pos+1} / ${list.length}`;
$("progress").style.width=((pos+1)/list.length*100)+"%";
$("question").textContent=q.q;
$("audio").innerHTML=type==="choukai"?`<div class="listen">🔊 Dengarkan kalimat Jepang <button onclick="speak()">Putar audio</button></div>`:"";
$("options").innerHTML=q.opts.map(o=>`<button class="option ${answers[pos]===o?"selected":""}" onclick="choose(${JSON.stringify(o).replace(/"/g,'&quot;')})">${o}</button>`).join("");
$("next").textContent=pos===list.length-1?"Selesaikan ujian":"Selanjutnya →";
if(type==="choukai")setTimeout(speak,250);
}
function choose(o){answers[pos]=o;show()}
function speak(){if(!window.speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(list[pos].q);u.lang="ja-JP";u.rate=.82;speechSynthesis.speak(u)}
function nextQuestion(){
if(answers[pos]===null){alert("Pilih jawaban terlebih dahulu.");return}
if(pos<list.length-1){pos++;show()}else finish()
}
function finish(){
let correct=list.filter((q,i)=>answers[i]===q.a).length;
let score=Math.round(correct/list.length*100),passed=score>=80;
let result={studentName:name,exam:TYPES.find(t=>t[0]===type)[2],correct,total:list.length,score,passed,date:new Date().toISOString(),certificateIssued:passed};
$("exam").classList.add("hidden");$("result").classList.remove("hidden");
$("score").textContent=score+"%";
$("status").textContent=passed?"🎉 SELAMAT, KAMU LULUS!":"Belum lulus. Tetap semangat!";
$("status").className=passed?"pass":"fail";
$("detail").textContent=`Jawaban benar ${correct} dari ${list.length}. Batas kelulusan 80%.`;
$("certificate").innerHTML=passed?certificate(result):"";
sendResult(result);
window.scrollTo(0,0);
}
function certificate(r){
let date=new Date(r.date).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
return `<div class="certificate" id="cert"><div>日本語 NIHONGO N5</div><h2>SERTIFIKAT KELULUSAN</h2><p>Diberikan kepada</p><div class="student">${safe(name)}</div><p>Telah menyelesaikan ujian <b>${r.exam}</b><br>dengan nilai <b>${r.score}%</b> dan dinyatakan <b>LULUS</b>.</p><p>Indonesia, ${date}</p><div class="cert-stamp">合格 · GOUKAKU</div><p style="font-size:11px">Sertifikat latihan mandiri Nihongo N5</p></div>`;
}
function safe(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function sendResult(r){
$("driveStatus").textContent="Mengirim riwayat ke Google Drive...";
if(!API_URL||API_URL.includes("PASTE_URL")){$("driveStatus").textContent="URL Apps Script belum dipasang. Hasil ujian tetap ditampilkan.";return}
try{
await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...r,answers:list.map((q,i)=>({question:q.q,answer:answers[i],correctAnswer:q.a,isCorrect:answers[i]===q.a}))})});
$("driveStatus").textContent="Riwayat ujian telah dikirim. Silakan periksa Google Sheets/Drive.";
}catch(e){$("driveStatus").textContent="Pengiriman gagal. Periksa koneksi dan URL Apps Script."}
}
function backHome(){if(window.speechSynthesis)speechSynthesis.cancel();$("exam").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");window.scrollTo(0,0)}
renderMenu();
</script>
</body>
</html>
