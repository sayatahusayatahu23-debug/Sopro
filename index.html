
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihongo N5 Examination</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1510;color:#edf5ef;font-family:Arial,sans-serif}
header{padding:22px;background:#14291d;border-bottom:1px solid #34513c}
header h1{color:#9ce6b5}
header p,.muted{color:#a6b9aa;font-size:13px;margin-top:7px;line-height:1.6}
main{max-width:750px;margin:auto;padding:18px}
.card{background:#14251b;border:1px solid #304b39;border-radius:15px;padding:20px;margin-bottom:16px}
h2{margin-bottom:14px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #45634c;background:#0b1710;color:white;font-size:16px;margin:12px 0}
button{padding:13px 17px;border:0;border-radius:9px;background:#65cf8b;color:#092014;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#304b39;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.category{background:#1c3826;color:white;border:1px solid #41654b;text-align:left;padding:17px;border-radius:12px}
.category strong{display:block;font-size:18px;margin:8px 0}
.symbol{font-size:28px;color:#9ce6b5}
.hidden{display:none!important}
.progress{height:7px;background:#304b39;border-radius:10px;margin:15px 0}
.progress div{height:100%;background:#65cf8b;width:0;border-radius:10px}
.question{font-size:22px;line-height:1.6;margin:22px 0}
.option{display:block;border:1px solid #405c48;padding:14px;border-radius:9px;margin:9px 0;cursor:pointer}
.option:has(input:checked){background:#20432d;border-color:#65cf8b}
.option input{width:auto;margin:0 10px 0 0}
.actions{display:flex;gap:10px;margin-top:20px}
.actions button{flex:1}
.stat{font-size:32px;color:#9ce6b5;margin:12px 0}
#status{line-height:1.7;margin-top:15px}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{padding:16px}}
</style>
</head>
<body>

<header>
<h1>日本語 NIHONGO N5</h1>
<p>Japanese Language Examination</p>
</header>

<main>

<section id="home" class="card">
<h2>Selamat Datang</h2>
<p class="muted">Masukkan nama peserta, kemudian pilih kategori ujian yang ingin dikerjakan.</p>
<input id="studentName" placeholder="Nama lengkap peserta">

<div class="grid">
<button class="category" onclick="startExam('Hiragana')">
<span class="symbol">あ</span>
<strong>Hiragana</strong>
25 soal
</button>
<button class="category" onclick="startExam('Katakana')">
<span class="symbol">ア</span>
<strong>Katakana</strong>
25 soal
</button>
<button class="category" onclick="startExam('Kanji')">
<span class="symbol">漢</span>
<strong>Kanji</strong>
20 soal
</button>
<button class="category" onclick="startExam('Bunpou')">
<span class="symbol">文</span>
<strong>Bunpou</strong>
20 soal
</button>
<button class="category" onclick="startExam('Choukai')">
<span class="symbol">聴</span>
<strong>Choukai</strong>
15 soal
</button>
</div>
<p class="muted">Setiap kategori memiliki ujian dan PDF hasil masing-masing. Nilai kelulusan: 80.</p>
</section>

<section id="exam" class="card hidden">
<p class="muted" id="categoryTitle"></p>
<div class="progress"><div id="progressBar"></div></div>
<p class="muted" id="counter"></p>
<div class="question" id="question"></div>
<div id="options"></div>
<div id="audioArea"></div>
<div class="actions">
<button class="secondary" onclick="previousQuestion()">Kembali</button>
<button id="nextButton" onclick="nextQuestion()">Berikutnya</button>
</div>
</section>

<section id="result" class="card hidden">
<h2>Hasil Ujian</h2>
<p id="resultCategory" class="muted"></p>
<div class="stat" id="score"></div>
<h2 id="passStatus"></h2>
<p id="resultName"></p>
<p id="resultDate" class="muted"></p>
<div id="breakdown" class="muted"></div>
<p id="status"></p>
<br>
<button onclick="window.print()">Cetak Hasil</button>
<button class="secondary" onclick="location.reload()">Kembali ke Menu</button>
</section>

</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzwS2tgXZ_F53cb4sMJjSzx-i29Tzzmlg8G-Zwo8VepQREmer2jZxUY_Fexu7rPVxUD/exec";

const bank={
Hiragana:[
["あ","a","i","u","e"],["い","i","a","o","u"],["う","u","e","a","o"],["え","e","i","u","a"],["お","o","a","i","u"],
["か","ka","ki","ku","ke"],["き","ki","ka","ku","ko"],["く","ku","ke","ki","ka"],["け","ke","ko","ka","ku"],["こ","ko","ka","ki","ku"],
["さ","sa","shi","su","se"],["し","shi","sa","su","so"],["す","su","se","shi","sa"],["せ","se","so","sa","su"],["そ","so","sa","shi","su"],
["た","ta","chi","tsu","te"],["ち","chi","ta","tsu","to"],["つ","tsu","te","chi","ta"],["て","te","to","ta","tsu"],["と","to","ta","chi","tsu"],
["な","na","ni","nu","ne"],["に","ni","na","nu","no"],["ぬ","nu","ne","ni","na"],["ね","ne","no","na","nu"],["の","no","na","ni","nu"]
],
Katakana:[
["ア","a","i","u","e"],["イ","i","a","o","u"],["ウ","u","e","a","o"],["エ","e","i","u","a"],["オ","o","a","i","u"],
["カ","ka","ki","ku","ke"],["キ","ki","ka","ku","ko"],["ク","ku","ke","ki","ka"],["ケ","ke","ko","ka","ku"],["コ","ko","ka","ki","ku"],
["サ","sa","shi","su","se"],["シ","shi","sa","su","so"],["ス","su","se","shi","sa"],["セ","se","so","sa","su"],["ソ","so","sa","shi","su"],
["タ","ta","chi","tsu","te"],["チ","chi","ta","tsu","to"],["ツ","tsu","te","chi","ta"],["テ","te","to","ta","tsu"],["ト","to","ta","chi","tsu"],
["ナ","na","ni","nu","ne"],["ニ","ni","na","nu","no"],["ヌ","nu","ne","ni","na"],["ネ","ne","no","na","nu"],["ノ","no","na","ni","nu"]
],
Kanji:[
["山","やま","かわ","そら","うみ"],["川","かわ","やま","あめ","はな"],["水","みず","ひ","き","つち"],["火","ひ","みず","つき","やま"],["木","き","いし","みず","はな"],
["人","ひと","いぬ","ねこ","とり"],["日","ひ","つき","やま","かわ"],["月","つき","ひ","ほし","そら"],["大","おおきい","ちいさい","ながい","みじかい"],["小","ちいさい","おおきい","たかい","やすい"],
["上","うえ","した","まえ","うしろ"],["下","した","うえ","なか","そと"],["中","なか","そと","うえ","した"],["本","ほん","かみ","まど","くるま"],["車","くるま","でんしゃ","じてんしゃ","ひこうき"],
["学校","がっこう","びょういん","ぎんこう","えき"],["先生","せんせい","がくせい","ともだち","かいしゃいん"],["学生","がくせい","せんせい","いしゃ","せんしゅ"],["電車","でんしゃ","じてんしゃ","くるま","ひこうき"],["名前","なまえ","じゅうしょ","でんわ","くに"]
],
Bunpou:[
["私は学生___。","です","ます","ある","いる"],["毎日学校___行きます。","へ","を","が","で"],["水___飲みます。","を","に","へ","が"],["これは私___本です。","の","に","で","へ"],["昨日学校___行きました。","へ","を","が","の"],
["猫___います。","が","を","へ","で"],["日本語___勉強します。","を","に","へ","が"],["七時___起きます。","に","を","で","が"],["友達___映画を見ます。","と","を","へ","の"],["学校___勉強します。","で","に","を","へ"],
["昨日は暑く___。","なかったです","ありません","ないです","でしたない"],["これはおいしい___です。","食べ物","食べる","食べて","食べ"],["ご飯を食べて___。","ください","でした","ます","ある"],["日本へ行ったこと___あります。","が","を","へ","で"],["本を読む___が好きです。","こと","もの","ところ","ため"],
["雨が降っています___、出かけません。","から","まで","しか","でも"],["学校へ行く___、友達に会います。","前に","あとで","ながら","だけ"],["ご飯を食べた___、勉強します。","あとで","前に","まで","から"],["これは私___かばんです。","の","を","に","で"],["日本語が上手に___たいです。","なり","する","ある","いる"]

["今日は何曜日ですか。月曜日です。","月曜日","火曜日","水曜日","木曜日"],

["何を食べますか。パンを食べます。","パン","ご飯","魚","肉"],
["何時に寝ますか。十時に寝ます。","十時","九時","八時","七時"],
["誰と行きますか。友達と行きます。","友達","先生","母","父"],
["何で行きますか。バスで行きます。","バス","電車","車","自転車"],
["今日は暑いですか。いいえ、寒いです。","寒いです","暑いです","暖かいです","涼しいです"],
["何を買いましたか。本を買いました。","本","水","服","靴"],
["どこで食べますか。レストランです。","レストラン","学校","家","駅"],
["何人ですか。三人です。","三人","二人","四人","五人"],
["いつ行きますか。明日行きます。","明日","今日","昨日","来週"],
["何をしますか。日本語を勉強します。","日本語を勉強します","寝ます","遊びます","働きます"],
["何時からですか。九時からです。","九時","八時","十時","七時"]
]
};

let currentCategory="";
let questions=[];
let answers=[];
let index=0;
let sending=false;

function shuffle(array){
 const a=[...array];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function startExam(category){
 const name=document.getElementById("studentName").value.trim();
 if(!name){alert("Masukkan nama peserta dahulu.");return;}

 currentCategory=category;
 questions=shuffle(bank[category]).map(q=>({
  question:q[0],
  answer:q[1],
  options:shuffle(q.slice(1))
 }));
 answers=Array(questions.length).fill(null);
 index=0;
 sending=false;

 document.getElementById("home").classList.add("hidden");
 document.getElementById("exam").classList.remove("hidden");
 showQuestion();
}

function showQuestion(){
 const q=questions[index];
 document.getElementById("categoryTitle").textContent=currentCategory;
 document.getElementById("counter").textContent=
  `Soal ${index+1} dari ${questions.length}`;
 document.getElementById("progressBar").style.width=
  ((index+1)/questions.length*100)+"%";
 document.getElementById("question").textContent=q.question;

 const area=document.getElementById("options");
 area.innerHTML="";

 q.options.forEach(option=>{
  const label=document.createElement("label");
  label.className="option";
  const radio=document.createElement("input");
  radio.type="radio";
  radio.name="answer";
  radio.value=option;
  radio.checked=answers[index]===option;
  radio.onchange=()=>answers[index]=option;
  label.append(radio,document.createTextNode(option));
  area.appendChild(label);
 });

 const audioArea=document.getElementById("audioArea");
 audioArea.innerHTML="";
 if(currentCategory==="Choukai"){
  const button=document.createElement("button");
  button.className="secondary";
  button.textContent="🔊 Dengarkan";
  button.onclick=()=>speak(q.question);
  audioArea.appendChild(button);
 }

 document.getElementById("nextButton").textContent=
  index===questions.length-1?"Selesai Ujian":"Berikutnya";
}

function speak(text){
 if(!window.speechSynthesis){
  alert("Audio tidak didukung browser.");
  return;
 }
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ja-JP";
 utterance.rate=.85;
 speechSynthesis.speak(utterance);
}

function previousQuestion(){
 if(index>0){index--;showQuestion();}
}

function nextQuestion(){
 if(index<questions.length-1){
  index++;
  showQuestion();
 }else{
  finishExam();
 }
}

async function finishExam(){
 if(sending)return;
 sending=true;

 const name=document.getElementById("studentName").value.trim();
 let correct=0;
 const details=questions.map((q,i)=>{
  const isCorrect=answers[i]===q.answer;
  if(isCorrect)correct++;
  return {
   question:q.question,
   answer:answers[i]||"Tidak dijawab",
   correct:q.answer,
   isCorrect
  };
 });

 const total=questions.length;
 const score=Math.round(correct/total*100);
 const passed=score>=80;

 const data={
  name:name,
  category:currentCategory,
  score:score,
  total:total,
  correct:correct,
  status:passed?"LULUS":"BELUM LULUS",
  categories:{
   [currentCategory]:{correct:correct,total:total}
  },
  details:details
 };

 document.getElementById("exam").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("resultCategory").textContent=
  "Kategori: "+currentCategory;
 document.getElementById("score").textContent=score+"/100";
 document.getElementById("passStatus").textContent=
  passed?"LULUS":"BELUM LULUS";
 document.getElementById("passStatus").style.color=
  passed?"#8ce6aa":"#ff9999";
 document.getElementById("resultName").textContent="Nama: "+name;
 document.getElementById("resultDate").textContent=
  new Date().toLocaleString("id-ID");
 document.getElementById("breakdown").textContent=
  `Jawaban benar: ${correct} dari ${total} soal.`;

 await sendResult(data);
}

async function sendResult(data){
 const status=document.getElementById("status");

 if(!API_URL.startsWith("https://script.google.com/")){
  status.textContent="URL Apps Script belum dipasang. Hasil belum dikirim.";
  return;
 }

 status.textContent="Mengirim hasil ke Google Drive...";

 try{
  await fetch(API_URL,{
   method:"POST",
   mode:"no-cors",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify(data)
  });

  status.textContent=
   "Permintaan pengiriman sudah dikirim. Periksa folder Google Drive untuk memastikan PDF tersimpan.";

 }catch(error){
  status.textContent="Pengiriman gagal. Periksa koneksi dan URL Apps Script.";
 }
}
</script>
</body>
</html>
